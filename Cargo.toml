[package]
name = "doc2flow"
version = "0.9.1"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "d2f"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
