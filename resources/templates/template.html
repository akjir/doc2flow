<!DOCTYPE html>
<html lang="{{LANG_CODE}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="generator" content="Doc2Flow {{APP_VERSION}}">
  <meta name="version" content="{{APP_VERSION_RAW}}">
  <meta name="repository" content="{{REPOSITORY_URL}}">
  <meta name="license" content="{{LICENSE_URL}}">
  <meta name="dcterms.created" content="{{CREATED_AT}}">
  <meta name="dcterms.source" content="{{REPOSITORY_URL}}">
  <meta name="features" content="{{FEATURES}}">
  <title>{{TITLE}}</title>
  <style>
{{CSS}}  </style>
</head>
<body>
  <header class="doc-header">
  </header>
  <main class="doc-body" data-comment-placeholder="{{L_COMMENT_PLACEHOLDER}}">
{{CONTENT}}    <div class="doc-body-buttons">
      <button type="button" class="item-button-pdf" id="item-button-pdf">{{L_EXPORT_PDF}}</button>
      <button type="button" class="item-button-save" id="item-button-save">{{L_SAVE_STATE}}</button>
      <button type="button" class="item-button-reset" id="item-button-reset" data-confirm="{{L_CONFIRM_RESET}}">{{L_RESET_ALL}}</button>
    </div>
  </main><!-- doc-body -->
  <script>
    window.d2f = window.d2f || {};
    window.d2f.document = window.d2f.document || {};
    window.d2f.document.id = '{{DOCUMENT_ID}}';
    window.d2f.document.language = '{{LANGUAGE_CODE}}';
{{JS}}  </script>
</body>
</html>
