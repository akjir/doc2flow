<!DOCTYPE html>
<html lang="{{LANG_CODE}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<div class="doc-header">
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUBTITLE}}</div>
  <div class="pb-wrap"><div class="pb" id="pb"></div></div>
  <div class="pt" id="pt">{{L_LOADING}}</div>
</div>
<div class="doc-body">

<table class="info-table">
  <tr><th>{{L_CUSTOMER}}</th><th>{{L_EMPLOYEE}}</th><th>{{L_TECHNICIAN}}</th></tr>
  <tr>
    <td>{{CUSTOMER}}</td>
    <td>{{EMPLOYEE}}</td>
    <td>{{TECHNICIAN}}</td>
  </tr>
</table>

<!-- START GENERATED CONTENT -->
{{CONTENT}}
<!-- END GENERATED CONTENT -->

<div class="finish" id="finish-box">
  <div class="big" id="finish-icon">&#x2714;</div>
  <h2 id="finish-title">{{L_SETUP_COMPLETED}}</h2>
  <div class="sigs">
    <div><input type="text" class="sf persistent-field" id="f_sign_tech" placeholder="{{L_NAME_PLACEHOLDER}}"><div style="margin-top:4px">{{L_SIGNATURE_TECHNICIAN}}</div></div>
    <div><input type="text" class="sf persistent-field" id="f_sign_date" placeholder="{{L_DATE_PLACEHOLDER}}"><div style="margin-top:4px">{{L_SIGNATURE_DATE}}</div></div>
  </div>
</div>
<div class="btnrow">
  <button class="btn-pdf" id="btn-pdf" onclick="exportPDF()">{{L_EXPORT_PDF}}</button>
  <button class="rst" onclick="resetAll()">{{L_RESET_ALL}}</button>
</div>

</div><!-- /doc-body -->

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lb-x" onclick="closeLightbox()">&times;</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
window.D2F_DOC_ID = '{{DOC_ID}}';
window.D2F_I18N = {{I18N_JSON}};
{{JS}}
</script>
</body>
</html>
